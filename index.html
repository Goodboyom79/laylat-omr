<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Laylat Omr · ليلة عمر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-width app column (wider for the admin view), role switcher on top, bottom tab bar */
:root{
  --bg:#F8F4EE; --surface:#FFFFFF; --sunk:#F0E9DF; --ink:#2B2420; --muted:#776B60; --line:#E6DCCF;
  --gold:#B08A57; --gold-ink:#86663A; --gold-soft:#F3EADC; --wine:#7B2D3B; --wine-soft:#F5E4E7;
  --btn:#86663A; --btn-ink:#FFFFFF; --good:#3B7A4E; --warn:#9C6311; --bad:#B03A3A;
  --f-logo:'Aref Ruqaa','Amiri',serif; --f-head:'Amiri','Times New Roman',serif;
  --f-body:'IBM Plex Sans Arabic',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17130F; --surface:#211B16; --sunk:#120E0B; --ink:#F1E9DF; --muted:#A99B8C; --line:#3A3028;
  --gold:#D3B07F; --gold-ink:#E2C496; --gold-soft:#33281C; --wine:#E08A9A; --wine-soft:#3A2027;
  --btn:#D3B07F; --btn-ink:#1C150E; --good:#79C08D; --warn:#E3A94F; --bad:#EF8080; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#17130F; --surface:#211B16; --sunk:#120E0B; --ink:#F1E9DF; --muted:#A99B8C; --line:#3A3028;
  --gold:#D3B07F; --gold-ink:#E2C496; --gold-soft:#33281C; --wine:#E08A9A; --wine-soft:#3A2027;
  --btn:#D3B07F; --btn-ink:#1C150E; --good:#79C08D; --warn:#E3A94F; --bad:#EF8080; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.65 var(--f-body);padding-inline:16px;padding-block:0 110px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.muted{color:var(--muted)}
.app{max-width:560px;margin:0 auto}
.app.wide{max-width:980px}

/* role bar */
.rolebar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);display:flex;gap:8px;align-items:center;padding-block:10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.proto{font-size:11.5px;font-weight:600;color:var(--wine);background:var(--wine-soft);padding:2px 10px;border-radius:999px}
.seg{display:flex;background:var(--sunk);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:5px 14px;border-radius:999px;cursor:pointer;font-weight:600;font-size:13.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgb(0 0 0 / .12)}
.reset{margin-inline-start:auto;border:0;background:none;color:var(--muted);font-size:12.5px;cursor:pointer;text-decoration:underline}

/* generic */
h1,h2,h3{margin:0}
.logo{font-family:var(--f-logo);font-size:38px;line-height:1.1;font-weight:700}
.logo-en{font-family:var(--f-head);font-size:13px;letter-spacing:.32em;color:var(--muted);text-transform:uppercase;direction:ltr}
.h2{font-family:var(--f-head);font-size:24px;font-weight:700;line-height:1.3}
.sec{display:grid;gap:12px;margin-top:26px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.link{border:0;background:none;color:var(--gold-ink);font-weight:600;cursor:pointer;padding:0;font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 18px;font-weight:600;cursor:pointer;display:inline-flex;gap:6px;align-items:center;justify-content:center;white-space:nowrap}
.btn.pri{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.btn.block{width:100%;padding:13px}
.btn.sm{padding:5px 12px;font-size:13px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.field{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;min-width:0}
.field:focus{border-color:var(--gold)}
label.lb{display:grid;gap:4px;font-size:13px;color:var(--muted);font-weight:500}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 14px;cursor:pointer;white-space:nowrap;font-size:14px}
.chip[aria-pressed="true"]{border-color:var(--gold);background:var(--gold-soft);font-weight:600}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 10px;border-radius:999px;white-space:nowrap}
.s-held{background:color-mix(in srgb,var(--warn) 15%,transparent);color:var(--warn)}
.s-confirmed{background:var(--gold-soft);color:var(--gold-ink)}
.s-released{background:color-mix(in srgb,var(--good) 15%,transparent);color:var(--good)}
.s-dispute,.s-declined{background:color-mix(in srgb,var(--bad) 13%,transparent);color:var(--bad)}
.s-refunded{background:var(--sunk);color:var(--muted)}
.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.empty{padding:22px;text-align:center;color:var(--muted);font-size:14px}
.note{font-size:12.5px;color:var(--muted)}
.row{display:flex;align-items:center;gap:12px;min-width:0}
.grow{flex:1;min-width:0}
.list>*+*{border-top:1px solid var(--line)}
.list>*{padding-block:12px}

/* home */
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding-top:18px}
.hello{font-size:13px;color:var(--muted)}
.count{display:flex;align-items:center;gap:14px;background:var(--gold-soft);border-radius:var(--r);padding:16px}
.count .d{font-family:var(--f-head);font-size:42px;line-height:1;font-weight:700;color:var(--gold-ink);min-width:70px;text-align:center}
.count input{background:transparent;border:0;border-bottom:1px dashed var(--gold);border-radius:0;padding:2px 0;width:auto}
.search{position:relative}
.search .ic{position:absolute;inset-inline-start:12px;top:50%;transform:translateY(-50%);color:var(--muted);width:20px;height:20px}
.search input{padding-inline-start:40px;border-radius:999px}
.side{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.side button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px;cursor:pointer;font-weight:600}
.side button[aria-pressed="true"]{border-color:var(--gold);background:var(--gold-soft)}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 6px}
.cat{border:0;background:none;display:grid;justify-items:center;gap:6px;cursor:pointer;font-size:12.5px;text-align:center;line-height:1.35;padding:0}
.cat .b{width:58px;height:58px;border-radius:50%;background:var(--gold-soft);display:grid;place-content:center;color:var(--gold-ink)}
.cat:hover .b{background:var(--gold);color:var(--btn-ink)}
.pkgs{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(260px,82%);gap:12px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.pkg{border-radius:var(--r);padding:18px;display:grid;gap:8px;background:var(--wine);color:#FFF6EE;align-content:start}
.pkg:nth-child(2){background:#5B4630}
.pkg:nth-child(3){background:#2F3E36}
.pkg h3{font-family:var(--f-head);font-size:22px}
.pkg ul{margin:0;padding-inline-start:18px;font-size:13.5px;opacity:.92}
.pkg .pr{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.pkg .pr b{font-size:20px}
.pkg .pr s{opacity:.65;font-size:13px}
.pkg .btn{background:#FFF6EE;color:#2B2420;border-color:transparent;justify-self:start}

/* providers */
.pv{display:flex;gap:12px;align-items:center;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;text-align:start;width:100%}
.pv:hover{border-color:var(--gold)}
.av{width:56px;height:56px;border-radius:14px;background:var(--gold-soft);color:var(--gold-ink);display:grid;place-content:center;flex:none}
.pv .n{font-weight:700}
.pv .m{font-size:13px;color:var(--muted)}
.price{font-weight:700;white-space:nowrap}
.star{color:var(--gold-ink);font-weight:600;font-size:13px}
.back{border:0;background:none;cursor:pointer;display:inline-flex;gap:6px;align-items:center;color:var(--muted);font-weight:600;padding:16px 0 4px}
.phero{border-radius:var(--r);padding:22px;background:linear-gradient(160deg,var(--gold-soft),var(--sunk));display:grid;gap:6px;margin-top:8px}
.phero h1{font-family:var(--f-head);font-size:30px;line-height:1.25}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.facts div{background:var(--surface);border-radius:12px;padding:8px 10px;font-size:12px;color:var(--muted)}
.facts b{display:block;color:var(--ink);font-size:15px}

/* calendar */
.cal-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.cal-h button{border:1px solid var(--line);background:var(--surface);border-radius:50%;width:34px;height:34px;cursor:pointer}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .wd{font-size:11.5px;color:var(--muted);padding-bottom:4px}
.day{aspect-ratio:1;border-radius:10px;border:1px solid transparent;background:var(--sunk);cursor:pointer;font-size:14px;display:grid;place-content:center;position:relative;max-width:100%;padding:0}
.day.free{background:var(--surface);border-color:var(--line)}
.day.free:hover{border-color:var(--gold)}
.day.booked{background:var(--wine-soft);color:var(--wine);text-decoration:line-through;cursor:not-allowed}
.day.blocked{background:var(--sunk);color:var(--muted);cursor:not-allowed}
.day.past{opacity:.35;cursor:default;background:transparent}
.day.sel{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.day.ev::after{content:"";position:absolute;bottom:4px;width:5px;height:5px;border-radius:50%;background:var(--gold)}
.prov .day.free,.prov .day.blocked{cursor:pointer}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:10px}
.sw{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-1px;margin-inline-end:5px;border:1px solid var(--line)}

/* budget */
.meter{height:10px;border-radius:5px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;background:var(--gold)}
.meter i.over{background:var(--bad)}
.bline{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.bline .av{width:44px;height:44px;border-radius:12px}
.flag{font-size:12px;font-weight:600}
.flag.ok{color:var(--good)}.flag.over{color:var(--bad)}.flag.mine{color:var(--gold-ink)}
.catpick{display:flex;flex-wrap:wrap;gap:6px}

/* bookings */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:10px 0 4px}
.steps span{height:4px;border-radius:2px;background:var(--sunk)}
.steps span.on{background:var(--gold)}
.steps-l{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;font-size:11px;color:var(--muted)}

/* invites */
.invite{border-radius:var(--r);padding:24px 20px;text-align:center;background:var(--surface);border:1px solid var(--gold);display:grid;gap:6px;justify-items:center;position:relative}
.invite::before{content:"";position:absolute;inset:6px;border:1px solid var(--gold-soft);border-radius:12px;pointer-events:none}
.invite .nm{font-family:var(--f-logo);font-size:34px;line-height:1.2}
.qr{background:#FFF;padding:8px;border-radius:10px;width:144px;height:144px;display:grid;place-content:center}
.qr img,.qr canvas{width:128px!important;height:128px!important}
textarea.field{min-height:96px;resize:vertical;line-height:1.7}

/* more */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:12px;display:grid;gap:4px;font-size:13px}
.tile b{font-size:14.5px}
.region{display:grid;grid-template-columns:90px 1fr 60px;gap:10px;align-items:center;font-size:14px}

/* admin */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.kpi .l{font-size:12.5px;color:var(--muted)}
.kpi .v{font-family:var(--f-head);font-size:28px;font-weight:700;line-height:1.3}
.kpi .s{font-size:12px;color:var(--muted)}
.split{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
input[type=range]{width:100%;accent-color:var(--gold-ink)}
.scroll{overflow-x:auto}
table.t{border-collapse:collapse;width:100%;min-width:620px;font-size:13.5px}
.t th{text-align:start;font-size:12px;color:var(--muted);font-weight:600;padding:0 8px 8px}
.t td{border-top:1px solid var(--line);padding:9px 8px}
.hbar{display:grid;grid-template-columns:120px 1fr 30px;gap:10px;align-items:center;font-size:13px}
.hbar .tr{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden}
.hbar .tr i{display:block;height:100%;background:var(--gold)}

/* nav + sheet + toast */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:560px;margin:0 auto;display:flex}
.nav button{flex:1;border:0;background:none;display:grid;justify-items:center;gap:2px;padding:9px 2px 10px;cursor:pointer;color:var(--muted);font-size:11.5px;font-weight:500}
.nav button[aria-current="page"]{color:var(--gold-ink);font-weight:700}
.nav .ic{width:22px;height:22px}
.scrim{position:fixed;inset:0;background:rgb(20 14 10 / .45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto;display:grid;gap:14px}
.pay{display:grid;gap:8px}
.pay label{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface);cursor:pointer}
.pay input{accent-color:var(--gold-ink)}
.escrow{display:flex;gap:10px;background:var(--gold-soft);border-radius:12px;padding:12px;font-size:13.5px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 18px;border-radius:999px;z-index:50;font-size:14px;max-width:calc(100% - 32px);text-align:center}
@media (max-width:420px){.cats{grid-template-columns:repeat(4,1fr)}.cat .b{width:52px;height:52px}.facts{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}}}
</style>

<div dir="rtl" lang="ar">
  <div class="app" id="app">
    <div class="rolebar">
      <span class="proto">نموذج أولي</span>
      <div class="seg" role="group" aria-label="عرض التطبيق كـ">
        <button data-act="role" data-v="customer">العميل</button>
        <button data-act="role" data-v="provider">مزوّد الخدمة</button>
        <button data-act="role" data-v="admin">الإدارة</button>
      </div>
      <button class="reset" data-act="reset">إعادة ضبط العرض</button>
    </div>
    <div id="view"></div>
  </div>
  <nav class="nav" id="nav"><div class="nav-in" id="navIn"></div></nav>
  <div id="sheet"></div>
  <div class="toast" id="toast" hidden></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
/* ---------- icons ---------- */
const IC={
 hall:'<path d="M3 21h18M5 21V9l7-5 7 5v12M9 21v-5a3 3 0 0 1 6 0v5"/>',
 tent:'<path d="M2 20L12 4l10 16zM12 4v16M8.5 20l3.5-6 3.5 6"/>',
 buffet:'<path d="M3 17h18M5 17a7 7 0 0 1 14 0M12 10V8M10 7.5h4M4 20h16"/>',
 flower:'<circle cx="12" cy="9" r="2.4"/><path d="M12 6.6c-.8-3.4 3.4-4 3.4-.9M14.4 9c3.2-.6 3.6 3.4.6 3.3M12 11.4c.6 3-3.6 3.4-3.4.4M9.6 9C6.4 9.6 6 5.6 9 5.8M12 12v9M12 17c-1.6-1.6-4-1.8-5-1M12 19c1.6-1.6 4-1.8 5-1"/>',
 camera:'<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',
 video:'<rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 10l5-3v10l-5-3"/>',
 music:'<path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/>',
 brush:'<path d="M14.5 3.5l6 6-8 8H6.5v-6z"/><path d="M6.5 17.5L3 21M11 8l5 5"/>',
 leaf:'<path d="M5 19C5 10 11 4 20 4c0 9-6 15-15 15zM5 19l8-8"/>',
 cake:'<path d="M4 21h16M5 21v-7h14v7M5 17.5c2.3 1 3.4-1 4.7 0s3.3 1 4.6 0 2.4 1 4.7 0M12 14v-3.5M12 8a1.2 1.2 0 0 0 0-3"/>',
 car:'<path d="M3 16v-4l2.2-5h13.6l2.2 5v4zM3 12h18"/><circle cx="7" cy="16.5" r="2"/><circle cx="17" cy="16.5" r="2"/>',
 shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/>',
 mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>',
 gift:'<rect x="3" y="8" width="18" height="13" rx="1"/><path d="M3 12h18M12 8v13M12 8C9.5 8 7.5 4 10 4s2 4 2 4 0-4 2-4 2 4-2 4"/>',
 gem:'<path d="M6 3h12l3 6-9 12L3 9zM3 9h18M9 3l3 18 3-18"/>',
 home:'<path d="M3 11l9-7 9 7M5 9.5V20h14V9.5"/>',
 wallet:'<rect x="3" y="6" width="18" height="14" rx="2"/><path d="M3 10h18M16 15h2"/>',
 cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
 grid:'<rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/>',
 inbox:'<path d="M3 13l3-8h12l3 8v6H3zM3 13h5l1 2h6l1-2h5"/>',
 chart:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
 search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',
 lock:'<rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>',
 back:'<path d="M9 6l6 6-6 6"/>',
 star:'<path d="M12 3l2.7 5.6 6.1.8-4.5 4.2 1.1 6L12 16.8 6.6 19.6l1.1-6L3.2 9.4l6.1-.8z"/>',
 users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6.5 6.5 0 0 1 3.5 6"/>'
};
const ic=(k,cls='ic')=>`<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true">${IC[k]||''}</svg>`;

/* ---------- catalogue (example data) ---------- */
const CITIES=['مسقط','صحار','نزوى','صلالة','صور','البريمي'];
const CATS=[
 {k:'hall',n:'قاعات الأعراس',i:'hall',side:'groom',a:.28},
 {k:'rest',n:'استراحات ومجالس وخيام',i:'tent',side:'groom',a:0},
 {k:'buffet',n:'البوفيه والضيافة',i:'buffet',side:'groom',a:.34},
 {k:'decor',n:'الزهور والكوشة',i:'flower',side:'bride',a:.10},

/* smart budget */
function plan(){
  const B=S.budget,mine=S.bookings.filter(b=>b.mine&&live(b));
  return B.cats.map(k=>{
    const have=mine.find(b=>PV[b.pid].cat===k);
    const alloc=CAT[k].a*B.total;
    if(have)return{k,alloc,p:PV[have.pid],amount:have.amount,mine:true};
    const cands=P.filter(p=>p.cat===k&&free(p.id,S.eventDate));
    if(!cands.length)return{k,alloc,p:null};
    const within=cands.filter(p=>cost(p)<=alloc).sort((a,b)=>(b.city===B.city)-(a.city===B.city)||b.rating-a.rating);
    const rest=cands.filter(p=>cost(p)>alloc).sort((a,b)=>cost(a)-cost(b));
    const all=[...within,...rest],i=(B.swap[k]||0)%all.length,p=all[i];
    return{k,alloc,p,amount:cost(p),over:cost(p)>alloc,alts:all.length};
  });
}

  city:d=>{S.city=d.v;go()},
  openCat:d=>{S.cat=d.v||null;S.q='';S.screen='list';go();scrollTo(0,0)},
  openP:d=>{S.pid=d.v;S.prevScreen=S.screen;S.screen='provider';S.pick=free(d.v,S.eventDate)?S.eventDate:null;S.calM.c=(S.pick||S.eventDate).slice(0,7);go();scrollTo(0,0)},
  backList:()=>{S.screen=S.prevScreen==='list'?'list':null;go()},
  mon:d=>{const[y,m]=S.calM[d.k].split('-').map(Number),n=new Date(y,m-1+Number(d.v),1);S.calM[d.k]=iso(n).slice(0,7);go()},
  pickDay:d=>{S.pick=d.v;go()},
  toggleDay:d=>{const a=S.blocked[S.provSelf]||(S.blocked[S.provSelf]=[]);const i=a.indexOf(d.v);i>=0?a.splice(i,1):a.push(d.v);go();toast(i>=0?'فُتح اليوم للحجز':'أُغلق اليوم')},
  bookOne:()=>{const p=PV[S.pid];S.sheet={items:[{pid:p.id,date:S.pick,amount:cost(p)}]};go()},
  bookPkg:d=>{const k=PKGS.find(x=>x.id===d.v),{full,price}=pkgPrice(k),busy=k.items.filter(id=>!free(id,S.eventDate));
    if(busy.length){toast(`${PV[busy[0]].name} غير متاح يوم زفافك، اختاري بديلاً من الخدمات`);return}
    S.sheet={title:k.name,items:k.items.map(id=>({pid:id,date:S.eventDate,amount:cost(PV[id])})),discount:full-price};go()},
  bookPlan:()=>{const items=plan().filter(x=>x.p&&!x.mine).map(x=>({pid:x.p.id,date:S.eventDate,amount:x.amount}));S.sheet={title:'خطة الميزانية',items};go()},
  closeSheet:()=>{S.sheet=null;go()},
  pay:()=>{const ratio=S.sheet.discount?1-S.sheet.discount/sum(S.sheet.items,x=>x.amount):1;
    S.sheet.items.forEach(x=>S.bookings.push({id:uid(),pid:x.pid,date:x.date,amount:Math.round(x.amount*ratio),status:'held',customer:S.me,mine:true}));
    S.sheet=null;S.screen=null;S.tab='bookings';go();scrollTo(0,0);toast('تم الدفع إلى الضمان وأُرسل الطلب للمزوّد')},
  swap:d=>{S.budget.swap[d.v]=(S.budget.swap[d.v]||0)+1;go()},
  bCat:d=>{const c=S.budget.cats,i=c.indexOf(d.v);i>=0?c.splice(i,1):c.push(d.v);go()},
  done:d=>{setStatus(d.v,'released');go();toast('شكراً! صُرف المبلغ للمزوّد بعد خصم العمولة')},
  dispute:d=>{setStatus(d.v,'dispute');go();toast('أُبلغ فريق ليلة عمر وبقي المبلغ في الضمان')},
  accept:d=>{setStatus(d.v,'confirmed');go();toast('تم قبول الحجز')},
  decline:d=>{setStatus(d.v,'declined');go();toast('أُبلغ العميل وأُعيد المبلغ إليه')},
  refund:d=>{setStatus(d.v,'refunded');go();toast('أُعيد المبلغ للعميل')},
  release:d=>{setStatus(d.v,'released');go();toast('صُرف المبلغ للمزوّد')},
  selG:d=>{S.inviteSel=d.v;go()},
  sent:d=>{const g=S.guests.find(x=>x.id===d.v);if(g){g.sent=!g.sent;go()}}
};
document.addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(!a||a.disabled)return;if(a.classList.contains('scrim')&&e.target!==a)return;e.preventDefault();ACT[a.dataset.act]?.(a.dataset)});
document.addEventListener('change',e=>{const t=e.target,v=t.value;
  if(t.id==='evDate'&&v){S.eventDate=v}
  else if(t.id==='gc'){S.guestsCount=Math.max(1,Number(v)||1)}
  else if(t.id==='bTotal'){S.budget.total=Math.max(100,Number(v)||0)}
  else if(t.id==='bCity'){S.budget.city=v}
  else if(t.id==='provSelf'){S.provSelf=v;S.calM.p='2026-12'}
  else if(t.id==='pA'){S.proj.avg=Number(v)||0}
  else if(t.id==='inviteMsg'){S.inviteMsg=v}
  else return; go();});
document.addEventListener('input',e=>{const t=e.target;
  if(t.id==='rate'){S.rate=Number(t.value);go();$('rate')?.focus()}
  if(t.id==='pW'){S.proj.weddings=Number(t.value);go();$('pW')?.focus()}});
document.addEventListener('submit',e=>{const f=e.target.closest('[data-form]');if(!f)return;e.preventDefault();const k=f.dataset.form,v=Object.fromEntries(new FormData(f));
  if(k==='search'){S.q=$('q').value;S.cat=null;S.screen='list';go()}
  if(k==='guest'){S.guests.push({id:uid(),name:v.name.trim(),phone:v.phone.replace(/\D/g,''),sent:false});go();toast('أُضيف الضيف')}
  if(k==='group'){S.groupMine=v.city;S.group[v.city]++;go();toast('سُجّل اهتمامك بالعرس الجماعي')}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.sheet){S.sheet=null;go()}});
render();
</script>

</html>
